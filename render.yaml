services:
  - type: web
    name: cybershield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: MONGODB_DB_NAME
        value: cybercrime
      - key: CORS_ORIGINS
        sync: false
      - key: VT_API_KEY
        sync: false
        optional: true
